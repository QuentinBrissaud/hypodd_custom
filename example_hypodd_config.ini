[relocator]
# Catalog arrival-time-only relocation. Set to true to also use waveform
# cross-correlation and dt.cc.
use_cross_correlation = false

# HypoDD ev_fix value. 1 fixes depth/z.
event_fix = 1

# HypoDD cannot safely use exactly 0 km depth in its 1D travel-time code.
fixed_depth_km = 0.01

# Patch HypoDD's LSQR solver to enforce zero mean x/y/z/origin-time update
# per cluster, matching equation (9). This forces a recompile when changed.
enforce_mean_shift_constraint = false
mean_shift_constraint_weight = 10.0

# LSQR fixed-parameter constraint weights used when ev_fix is set.
lsqr_constraint_weight = 100.0
lsqr_xyz_constraint_weight = 10.0
lsqr_time_constraint_weight = 1000.0

[cross_correlation]
# These parameters are used only when use_cross_correlation = true.
# Cross-correlation window relative to the pick time, in seconds.
cc_time_before = 0.05
cc_time_after = 0.2

# Maximum lag searched during pick cross-correlation, in seconds.
cc_maxlag = 0.1

# Cross-correlation implementation. Use obspy for the original
# xcorr_pick_correction behavior, or numpy_cache for cached waveform reads plus
# vectorized integer-sample normalized correlation.
cc_backend = obspy

# Write one intermediate file per event pair. Set false for faster runs that
# only need the final dt.cc file.
cc_write_pair_files = true

# Filter applied before cross-correlation. Use bandpass or none.
cc_filter = bandpass
cc_filter_min_freq = 1.0
cc_filter_max_freq = 20.0

# Minimum accepted cross-correlation coefficient.
cc_min_allowed_cross_corr_coeff = 0.4

# Component weights. The component is matched as the final channel character,
# e.g. Z matches BHZ/HHZ. Use P:1.0/S:1.0 only if you encoded artificial
# phase-specific channels ending in P/S.
cc_p_phase_weighting = Z:1.0,E:0.0,N:0.0
cc_s_phase_weighting = Z:1.0,E:1.0,N:1.0

[preset_events]
# Optional CSV with QuakeML event ids to keep before ph2dt builds pairs.
# The cluster column is stored as metadata only; it does not prevent events
# from different preset clusters from connecting in the HypoDD graph.
file =
event_id_column = event_id
cluster_column = dbscan_cluster

[ph2dt]
# Minimum pick weight accepted.
MINWGHT = 0.0

# Maximum event-station distance in km. Leave unset to let the wrapper compute
# a value that includes all event-station pairs.
# MAXDIST = 300

# Maximum event-event separation in km for candidate pairs.
MAXSEP = 5

# Maximum origin-time separation between paired events in days. This is a
# wrapper-side dt.ct filter applied after ph2dt. Use -999 to disable.
MAXTIMESEP_DAYS = -999

# Maximum number of neighboring events considered per event.
MAXNGH = 10

# Minimum shared observations for strong links and selected event pairs.
MINLNK = 12
MINOBS = 12

# Maximum observations kept per event pair.
MAXOBS = 50

[hypodd]
# Use P and S phases.
IPHA = 3

# In catalog-only mode, OBSCT is the HypoDD cluster threshold.
OBSCC = 0
OBSCT = 12

# Disable distance/gap filters inside HypoDD.
MINDS = -999
MAXDS = -999
MAXGAP = -999

# Start from catalog locations, use LSQR, remove air quakes.
ISTART = 2
ISOLV = 2
IAQ = 2

# Relocate all clusters and all events.
CID = 0
ID =

# HypoDD iteration rows.
# Columns:
#   NITER  = number of iterations for this row
#   WTCCP  = global weight for P cross-correlation differential times (dt.cc)
#   WTCCS  = global weight for S cross-correlation differential times (dt.cc)
#   MAXRCC = maximum allowed CC residual; -999 disables this cutoff
#   MAXDCC = maximum allowed CC event-pair distance; -999 disables this cutoff
#   WTCTP  = global weight for P catalog differential times (dt.ct)
#   WTCTS  = global weight for S catalog differential times (dt.ct)
#   MAXRCT = maximum allowed catalog residual; -999 disables this cutoff
#   MAXDCT = maximum allowed catalog event-pair distance; -999 disables this cutoff
#   DAMP   = LSQR damping; larger values make relocation more conservative
# Cross-correlation data are commonly weighted more strongly than catalog
# picks, e.g. WTCCP/WTCTP = 1.0/0.1 = 10.
# This example row has WTCCP=0 and WTCCS=0, so it ignores dt.cc even if
# use_cross_correlation=true. Set nonzero WTCCP/WTCCS to use CC in HypoDD.
ITERATIONS =
    100 0 0 -999 -999 0.1 0.05 6 -999 30

[compiler]
# HypoDD uses static Fortran arrays. Tighter clustering can create many more
# clusters, so allow more than the wrapper's old MAXCL=20.
MAXEVE0 = 200
MAXDATA = 3000000
MAXDATA0 = 60000
MAXCL = 500
