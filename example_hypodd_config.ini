[relocator]
# Catalog arrival-time-only relocation. Set to true to also use waveform
# cross-correlation and dt.cc.
use_cross_correlation = false

# HypoDD ev_fix value. 1 fixes depth/z.
event_fix = 1

# HypoDD cannot safely use exactly 0 km depth in its 1D travel-time code.
fixed_depth_km = 0.01

# Patch HypoDD's LSQR solver to enforce zero mean x/y/z/origin-time update
# per cluster, matching equation (9). This forces a recompile when changed.
enforce_mean_shift_constraint = false
mean_shift_constraint_weight = 10.0

# LSQR fixed-parameter constraint weights used when ev_fix is set.
lsqr_constraint_weight = 100.0
lsqr_xyz_constraint_weight = 10.0
lsqr_time_constraint_weight = 1000.0

[cross_correlation]
# These parameters are used only when use_cross_correlation = true.
# Cross-correlation window relative to the pick time, in seconds.
cc_time_before = 0.05
cc_time_after = 0.2

# Maximum lag searched during pick cross-correlation, in seconds.
cc_maxlag = 0.1

# Bandpass filter applied before cross-correlation.
cc_filter_min_freq = 1.0
cc_filter_max_freq = 20.0

# Minimum accepted cross-correlation coefficient.
cc_min_allowed_cross_corr_coeff = 0.4

# Component weights. The component is matched as the final channel character,
# e.g. Z matches BHZ/HHZ. Use P:1.0/S:1.0 only if you encoded artificial
# phase-specific channels ending in P/S.
cc_p_phase_weighting = Z:1.0,E:0.0,N:0.0
cc_s_phase_weighting = Z:1.0,E:1.0,N:1.0

[ph2dt]
# Minimum pick weight accepted.
MINWGHT = 0.0

# Maximum event-station distance in km. Leave unset to let the wrapper compute
# a value that includes all event-station pairs.
# MAXDIST = 300

# Maximum event-event separation in km for candidate pairs.
MAXSEP = 5

# Maximum number of neighboring events considered per event.
MAXNGH = 10

# Minimum shared observations for strong links and selected event pairs.
MINLNK = 12
MINOBS = 12

# Maximum observations kept per event pair.
MAXOBS = 50

[hypodd]
# Use P and S phases.
IPHA = 3

# In catalog-only mode, OBSCT is the HypoDD cluster threshold.
OBSCC = 0
OBSCT = 12

# Disable distance/gap filters inside HypoDD.
MINDS = -999
MAXDS = -999
MAXGAP = -999

# Start from catalog locations, use LSQR, remove air quakes.
ISTART = 2
ISOLV = 2
IAQ = 2

# Relocate all clusters and all events.
CID = 0
ID =

# HypoDD iteration rows:
# NITER WTCCP WTCCS MAXRCC MAXDCC WTCTP WTCTS MAXRCT MAXDCT DAMP
ITERATIONS =
    100 0 0 -999 -999 0.1 0.05 6 -999 30

[compiler]
# HypoDD uses static Fortran arrays. Tighter clustering can create many more
# clusters, so allow more than the wrapper's old MAXCL=20.
MAXEVE0 = 200
MAXDATA = 3000000
MAXDATA0 = 60000
MAXCL = 500
